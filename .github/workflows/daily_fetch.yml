name: Daily Rank Fetch

on:
  schedule:
    - cron: '0 1 * * *'   # 每天 09:00 CST (UTC+8 = UTC+0 01:00)
  workflow_dispatch:        # 支持手动触发

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt playwright

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Fetch rankings & launch data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python main.py fetch

      - name: Competitor anomaly check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LLM_PROXY_API_KEY: ${{ secrets.LLM_PROXY_API_KEY }}
          LLM_PROXY_BASE_URL: "https://llm-proxy.lilithgames.com/v1"
          LLM_PROXY_MODEL: "claude-haiku-4-5-20251001"
        run: python main.py competitor
